<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titanic Bow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent}
  #scene{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;font-family:'Press Start 2P',ui-monospace,monospace;background:#363a6e}
  #scene.clear{background:transparent}
  #sky{position:absolute;inset:0;width:100%;height:100%;display:block}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;outline:none}
  #gl.grabbing{cursor:grabbing}
  #gl.pointer{cursor:pointer}
  .bubble{position:absolute;left:0;top:0;z-index:4;pointer-events:none;background:#fffaf0;color:#2a1d14;
    font-size:8px;line-height:1.6;padding:6px 8px 5px;border:2px solid #2a1d14;box-shadow:3px 3px 0 rgba(0,0,0,.28);
    white-space:nowrap;opacity:0;transform:translate(-50%,-100%) scale(.5);transform-origin:50% 100%;
    transition:opacity .18s ease,transform .3s cubic-bezier(.3,1.7,.5,1)}
  .bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .bubble:after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-4px;width:6px;height:6px;
    background:#fffaf0;border-right:2px solid #2a1d14;border-bottom:2px solid #2a1d14;transform:rotate(45deg)}
  #ui{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;display:flex;gap:2px;padding:4px;
    background:rgba(16,18,36,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
  #ui button{appearance:none;border:0;background:transparent;color:#fff;font:inherit;font-size:8px;letter-spacing:.02em;
    padding:9px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;opacity:.7;
    transition:background .25s,opacity .25s}
  #ui button:hover{opacity:1}
  #ui button.on{background:rgba(255,255,255,.2);opacity:1}
  #ui svg{width:14px;height:14px;flex:none}
  #ui .sep{width:1px;background:rgba(255,255,255,.18);margin:6px 3px}
  #hint{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:5;color:#fff;font-size:8px;opacity:0;
    text-shadow:0 1px 3px rgba(0,0,0,.45);transition:opacity 1.2s;pointer-events:none;white-space:nowrap}
  #hint.show{opacity:.85}
  #fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#fff;font-size:10px;text-align:center;padding:24px}
  @media (max-width:560px){
    #ui button span{display:none}
    #ui button{padding:10px 11px}
    #ui{bottom:12px}
    #hint{top:12px;font-size:7px}
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="sky"></canvas>
  <canvas id="gl" tabindex="-1" aria-label="Interactive 3D Titanic diorama"></canvas>
  <div id="hint">Drag to rotate · Tap anything</div>
  <div id="ui" role="toolbar" aria-label="Scene controls">
    <button data-mood="dawn" title="Dawn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12h12M4.5 12a3.5 3.5 0 0 1 7 0M8 3v2M3.2 6.2l1.3 1.3M12.8 6.2l-1.3 1.3"/></svg><span>Dawn</span></button>
    <button data-mood="day" title="Day"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><span>Day</span></button>
    <button data-mood="sunset" title="Sunset"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 11h12M4.5 11a3.5 3.5 0 0 1 7 0M3 14h10M8 3v3l-1.5-1.5M8 6l1.5-1.5"/></svg><span>Sunset</span></button>
    <button data-mood="night" title="Night"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12.5 10.2A5 5 0 0 1 5.8 3.5a5 5 0 1 0 6.7 6.7z"/></svg><span>Night</span></button>
    <div class="sep"></div>
    <button id="snd" title="Sound"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 6v4h2.5l3.5 3V3L5 6z"/><path class="w" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.8a6 6 0 0 1 0 8.4"/><path class="x" d="M11 6l3.5 4M14.5 6L11 10" style="display:none"/></svg></button>
  </div>
  <div id="fallback">This scene needs WebGL to run.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============ CONFIG — tweak these ============ */
const CONFIG = {
  defaultMood: 'sunset',       // 'dawn' | 'day' | 'sunset' | 'night'
  autoCycle: false,            // cycle through moods on its own
  autoCycleSeconds: 14,
  showUI: true,                // mood switcher + sound button
  showHint: true,              // "Drag to rotate" hint at the top
  transparentBackground: false,// true = no sky, use your Framer background
  sound: true,                 // sounds play only after a click/tap
  shipSpeed: 0.3,              // how fast the sea flows past the ship (0 = still)
  visibleFraction: 0.28        // how much of the ship shows before the back wall cuts it (0.15 – 0.45)
};
/* ============================================== */

const root = document.getElementById('scene');
const glCanvas = document.getElementById('gl');
const skyCanvas = document.getElementById('sky');
const skyCtx = skyCanvas.getContext('2d');
if (CONFIG.transparentBackground) { root.classList.add('clear'); skyCanvas.style.display = 'none'; }
if (!CONFIG.showUI) document.getElementById('ui').style.display = 'none';

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  return;
}
const SMALL = Math.min(innerWidth, innerHeight) < 600;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, SMALL ? 1.75 : 2));
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xffffff, 0);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 200);
const V3 = THREE.Vector3;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.castShadow = true;
const SM = SMALL ? 1024 : 2048;
sun.shadow.mapSize.set(SM, SM);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 70 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3.5;
const rimLight = new THREE.DirectionalLight(0xffc9a8, 0.55);
rimLight.position.set(-10, 6, -11);
scene.add(rimLight);
scene.add(sun, sun.target);

/* ---------- constants ---------- */
const HX = 6.2, HZ = 3.6, RAD = 1.0, DEPTH = 2.2, WY = 0.03;   // squarer tank so the hull meets a straight wall

function M(color, o) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.78, metalness: 0, flatShading: true }, o || {}));
}
function rrShape(hx, hz, r) {
  const s = new THREE.Shape();
  s.moveTo(-hx + r, -hz); s.lineTo(hx - r, -hz);
  s.absarc(hx - r, -hz + r, r, -Math.PI / 2, 0, false);
  s.lineTo(hx, hz - r);
  s.absarc(hx - r, hz - r, r, 0, Math.PI / 2, false);
  s.lineTo(-hx + r, hz);
  s.absarc(-hx + r, hz - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(-hx, -hz + r);
  s.absarc(-hx + r, -hz + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
function sdRB(x, z) {
  const qx = Math.abs(x) - HX + RAD, qz = Math.abs(z) - HZ + RAD;
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - RAD;
}


/* ---------- bow placement ---------- */
const S_SHIP = 3.15, SHIP_ANG = -0.05;          // ship scale and heading (runs along the back edge)
const BOW_X = 4.12, STERN_X = -4.12;
const HEAD = new V3(Math.cos(SHIP_ANG), 0, -Math.sin(SHIP_ANG)), PERP = new V3(-HEAD.z, 0, HEAD.x);
const X_CUT = BOW_X - clamp(CONFIG.visibleFraction, 0.15, 0.45) * (BOW_X - STERN_X);
const WALL_Z = -0.95;   // the hull's centreline enters through the straight left wall here, in the back half
const SHIP_P = new V3(-HX - S_SHIP * X_CUT * HEAD.x, 0, WALL_Z - S_SHIP * X_CUT * HEAD.z);
const SHIP_LANE = SHIP_P.x * PERP.x + SHIP_P.z * PERP.z;
const SHIP_POS = new THREE.Vector2(SHIP_P.x, SHIP_P.z);
const FOCUS = new V3(SHIP_P.x + HEAD.x * S_SHIP * 3.0, 0, SHIP_P.z + HEAD.z * S_SHIP * 3.0);

/* ---------- soft-clay material patch ---------- */
// rim light + hand-sculpted surface wobble + optional clipping to the tank (with filled cut faces)
const CLAY_U = { uRim: { value: new THREE.Color(1, 0.8, 0.7) }, uTank: { value: new V3(HX, HZ, RAD) } };
const BEGIN_TW = `#include <begin_vertex>
  vLP = transformed;
  #ifdef USE_INSTANCING
    vTW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
  #else
    vTW = (modelMatrix * vec4(transformed, 1.0)).xyz;
  #endif`;
const CLAY_GLSL = `
varying vec3 vTW; varying vec3 vLP;
uniform vec3 uRim; uniform vec3 uTank;
float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vn3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f*f*(3.-2.*f);
  return mix(mix(mix(h3(i), h3(i+vec3(1,0,0)), f.x), mix(h3(i+vec3(0,1,0)), h3(i+vec3(1,1,0)), f.x), f.y),
             mix(mix(h3(i+vec3(0,0,1)), h3(i+vec3(1,0,1)), f.x), mix(h3(i+vec3(0,1,1)), h3(i+vec3(1,1,1)), f.x), f.y), f.z); }
float tankSD(vec2 p){ vec2 q = abs(p) - uTank.xy + uTank.z; return length(max(q,0.)) + min(max(q.x,q.y),0.) - uTank.z; }
`;
let clayN = 0;
function clay(mat, o) {
  o = o || {};
  const bump = o.bump === undefined ? 1 : o.bump;
  const key = 'clay|' + (o.clip ? 1 : 0) + (o.cut ? 1 : 0) + '|' + bump + '|' + (o.colorCode ? ++clayN : '');
  mat.onBeforeCompile = sh => {
    sh.uniforms.uRim = CLAY_U.uRim; sh.uniforms.uTank = CLAY_U.uTank;
    if (o.cut) sh.uniforms.uCut = { value: new THREE.Color(o.cut) };
    sh.vertexShader = 'varying vec3 vTW; varying vec3 vLP;\n' + sh.vertexShader.replace('#include <begin_vertex>', BEGIN_TW);
    let f = CLAY_GLSL + (o.cut ? 'uniform vec3 uCut;\n' : '') + sh.fragmentShader;
    if (o.clip) f = f.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (tankSD(vTW.xz) > -0.015) discard;');
    f = f.replace('#include <color_fragment>', '#include <color_fragment>\n' + (o.colorCode || '') + (o.cut ? '\n  if (!gl_FrontFacing) diffuseColor.rgb = uCut;' : ''));
    const lit = !mat.isMeshBasicMaterial;
    if (lit && bump > 0) f = f.replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
  normal = normalize(normal + ${(0.08 * bump).toFixed(3)} * (vec3(vn3(vLP * 22.), vn3(vLP * 22. + 5.1), vn3(vLP * 22. + 9.7)) - 0.5));`);
    if (lit) f = f.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );', `
  float rimF = pow(1. - saturate(dot(normal, normalize(vViewPosition))), 2.6);
  outgoingLight += uRim * rimF * 0.45 * (0.3 + diffuseColor.rgb);
  outgoingLight = mix(outgoingLight, outgoingLight * vec3(1.04, 1.0, 0.96), 0.6);
  gl_FragColor = vec4( outgoingLight, diffuseColor.a );`);
    sh.fragmentShader = f;
  };
  mat.customProgramCacheKey = () => key;
  return mat;
}
// shadow-depth material that respects the same tank clip
const tankDepth = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking });
tankDepth.onBeforeCompile = sh => {
  sh.uniforms.uTank = CLAY_U.uTank;
  sh.vertexShader = 'varying vec3 vTW; varying vec3 vLP;\n' + sh.vertexShader.replace('#include <begin_vertex>', BEGIN_TW);
  sh.fragmentShader = CLAY_GLSL + sh.fragmentShader.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n  if (tankSD(vTW.xz) > -0.015) discard;');
};
tankDepth.customProgramCacheKey = () => 'tankDepth';

// rounded box with true rounded normals (soft clay edges)
function rbox(w, h, d, r, seg) {
  seg = seg || 8;
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const p = g.attributes.position, n = g.attributes.normal, v = new V3(), inn = new V3();
  const hw = w / 2, hh = h / 2, hd = d / 2;
  r = Math.min(r, hw * 0.95, hh * 0.95, hd * 0.95);
  const ease = (x, H) => Math.sign(x) * H * (1 - Math.pow(Math.max(0, 1 - Math.abs(x) / H), 1.8));
  for (let i = 0; i < p.count; i++) {
    v.set(ease(p.getX(i), hw), ease(p.getY(i), hh), ease(p.getZ(i), hd));
    inn.set(clamp(v.x, -hw + r, hw - r), clamp(v.y, -hh + r, hh - r), clamp(v.z, -hd + r, hd - r));
    v.sub(inn); const L = v.length() || 1; v.multiplyScalar(1 / L);
    n.setXYZ(i, v.x, v.y, v.z);
    p.setXYZ(i, inn.x + v.x * r, inn.y + v.y * r, inn.z + v.z * r);
  }
  return g;
}
function capsule(r, len, seg) {
  const pts = [], n = 8;
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(a) * r, 0.0001), -len / 2 + Math.sin(a) * r)); }
  for (let i = 0; i <= n; i++) { const a = i / n * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(Math.cos(a) * r, 0.0001), len / 2 + Math.sin(a) * r)); }
  return new THREE.LatheGeometry(pts, seg || 16);
}

const world = new THREE.Group();
scene.add(world);

/* ---------- water column (side walls) ---------- */
const SDF_GLSL = `
float sdRB(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q,0.)) + min(max(q.x,q.y),0.) - r; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x), mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y); }`;

const sideMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 }, uTop: { value: new THREE.Color() }, uBot: { value: new THREE.Color() },
    uSand: { value: new THREE.Color() }, uSunDir: { value: new V3(0, 1, 0) },
    uTopY: { value: 0.05 }, uBotY: { value: 0.05 - DEPTH }
  },
  vertexShader: `varying vec3 vP; varying vec3 vN;
    void main(){ vP = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: SDF_GLSL + `
    uniform float uTime, uTopY, uBotY; uniform vec3 uTop, uBot, uSand, uSunDir;
    varying vec3 vP; varying vec3 vN;
    void main(){
      float t = clamp((vP.y - uBotY) / (uTopY - uBotY), 0., 1.);
      vec3 col = mix(uBot, uTop, pow(t, 1.25));
      float c = sin(vP.x*2.6 + uTime*1.2 + sin(vP.z*2.1 + uTime*0.8)) * sin(vP.z*3.1 - uTime*1.05 + vP.x*0.7) * 0.5 + 0.5;
      col += pow(c, 5.) * 0.16 * t;
      float ray = sin((vP.x + vP.z) * 1.6 + vP.y * 0.8 + uTime * 0.25) * 0.5 + 0.5;
      col += smoothstep(0.75, 1., ray) * 0.05 * t;
      vec2 g = vec2((vP.x - vP.z) * 7., vP.y * 7. - uTime * 1.1);
      vec2 id = floor(g); vec2 f = fract(g) - 0.5;
      float b = step(0.94, hash(id)) * smoothstep(0.16, 0.1, length(f)) * smoothstep(0.06, 0.1, length(f));
      col += b * 0.35 * smoothstep(0.15, 0.5, t);
      float sandY = uBotY + 0.42 + sin(vP.x*1.7 + vP.z)*0.07 + sin(vP.z*2.9 - vP.x*0.5)*0.05;
      if (vP.y < sandY) {
        float grain = hash(floor(vP.xz * 30. + vP.y * 40.));
        col = uSand * (0.82 + 0.18 * grain) * (0.75 + 0.25 * smoothstep(uBotY, sandY, vP.y));
        if (vP.y > sandY - 0.035) col *= 1.12;
      }
      col += smoothstep(uTopY - 0.045, uTopY, vP.y) * 0.28;
      float l = 0.78 + 0.28 * max(dot(normalize(vN), uSunDir), 0.);
      gl_FragColor = vec4(col * l, 1.);
    }`
});
{
  const g = new THREE.ExtrudeGeometry(rrShape(HX, HZ, RAD), { depth: DEPTH, bevelEnabled: false, curveSegments: 64 });
  g.rotateX(Math.PI / 2);
  g.translate(0, 0.05, 0);
  const hidden = new THREE.MeshBasicMaterial({ visible: false });
  world.add(new THREE.Mesh(g, [hidden, sideMat]));
}

/* ---------- display plinth + ground ---------- */
const PL_TOP = 0.05 - DEPTH;
const plinthMat = clay(new THREE.MeshStandardMaterial({ color: 0x4b2f20, roughness: 0.5, metalness: 0.02 }), { bump: 0.35 });
const trimMat = clay(new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.55 }), { bump: 0.35 });
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = '#5a3826'; x.fillRect(0, 0, 512, 64);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(${Math.random() < 0.5 ? '30,16,8' : '120,80,52'},${rand(0.08, 0.25)})`;
    x.lineWidth = rand(0.5, 2); x.beginPath();
    const y = rand(0, 64); x.moveTo(0, y);
    for (let k = 0; k <= 8; k++) x.lineTo(k * 64, y + Math.sin(k * 1.3 + i) * rand(1, 4));
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.12, 0.9);
  plinthMat.map = t; plinthMat.color.set(0xffffff);
}
function slab(pad, depth, bevel, yTop, mat) {
  const g = new THREE.ExtrudeGeometry(rrShape(HX + pad, HZ + pad, RAD + pad),
    { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 64 });
  g.rotateX(Math.PI / 2);
  g.translate(0, yTop - bevel, 0);
  const m = new THREE.Mesh(g, mat); m.castShadow = true; m.receiveShadow = true; world.add(m);
  return yTop - depth - bevel * 2;
}
let yb = slab(0.12, 0.06, 0.02, PL_TOP, trimMat);
yb = slab(0.32, 0.4, 0.05, yb, plinthMat);
const FLOOR_Y = slab(0.44, 0.05, 0.025, yb, trimMat);
// brass plaque
{
  const c = document.createElement('canvas'); c.width = 512; c.height = 72;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 72);
  g.addColorStop(0, '#f3d98b'); g.addColorStop(0.5, '#c79a3e'); g.addColorStop(1, '#8a6422');
  x.fillStyle = g; x.fillRect(0, 0, 512, 72);
  x.strokeStyle = 'rgba(70,45,10,.7)'; x.lineWidth = 3; x.strokeRect(6, 6, 500, 60);
  x.fillStyle = '#3f2a0b'; x.font = 'bold 30px Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('R.M.S. TITANIC  ·  1912', 256, 38);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.28),
    new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: 0.35, metalness: 0.25 }));
  p.position.set(0, PL_TOP - 0.1 - 0.25, HZ + 0.32 + 0.05 + 0.004);
  world.add(p);
}
// floor that fades into the sky, so the piece sits on a surface
const fadeTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d'); const g = x.createRadialGradient(128, 128, 20, 128, 128, 128);
  g.addColorStop(0, '#fff'); g.addColorStop(0.45, '#fff'); g.addColorStop(0.95, '#000'); g.addColorStop(1, '#000');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c);
})();
const floorMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95, alphaMap: fadeTex, transparent: true, depthWrite: false });
{
  const f = new THREE.Mesh(new THREE.PlaneGeometry(34, 34), floorMat);

  vertexShader: SDF_GLSL + `

    varying vec3 vPos; varying vec3 vN; varying float vH; varying vec3 vWorld;
    float H(vec2 p){
      float e = clamp(-sdRB(p, uHalf, uRad) / 1.3, 0., 1.);

      h += sin(p.y*1.7 - uTime*0.9 + p.x*0.4) * 0.035;
      h += sin((p.x + p.y)*2.9 + uTime*2.1) * 0.014;
      h += sin((p.x - p.y*0.6)*4.6 - uTime*2.8) * 0.007;
      h += sin((p.x + uFlow) * 2.3 + p.y * 0.35) * 0.012 + sin((p.x + uFlow) * 5.1 - p.y * 1.2) * 0.005;
      h *= mix(0.2, 1., e);
      for (int i = 0; i < ${MAX_RIP}; i++) {
        float t = uTime - uRip[i].z;
        if (t > 0. && t < 4.5) {
          float d = distance(p, uRip[i].xy);
          float f = d - t * 1.5;
          h += sin(f * 9.) * exp(-f * f * 3.) * exp(-t * 0.85) * 0.085 * e;
        }

      h += sin(dm * 15. - uTime * 5.5) * exp(-dm * 1.9) * 0.022 * uMouse.z * e;

      vN = normalize(vec3(h - hx, eps, h - hz));

    varying vec3 vPos; varying vec3 vN; varying float vH; varying vec3 vWorld;
    void main(){

      if (sd > 0.) discard;
      vec3 N = normalize(vN);
      vec3 V = normalize(cameraPosition - vWorld);
      float fres = pow(1. - max(dot(N, V), 0.), 3.);
      vec3 col = mix(uDeep, uShallow, clamp(vH * 5. + 0.42, 0., 1.) * 0.65);

      float n2 = sin(vPos.x*23. - uTime*4.) * sin(vPos.z*19. + uTime*3.3) * 0.5 + 0.5;
      float dh = length(vec2(max(abs(l.x) - 3.55, 0.), l.y)) - 0.56;
      float foam = smoothstep(0.09, 0.0, dh) * (0.45 + 0.55 * n);
      float bx = l.x - 3.9;  // bow wave
      if (bx > -1.2) foam += smoothstep(0.045, 0., abs(abs(l.y) - (0.6 - bx*0.3))) * smoothstep(1.4, -0.2, abs(bx+0.3)) * 0.8;
      float wx = -l.x - 4.0; // wake
      if (wx > 0.) {

      float fx = l.x * uShipS + uFlow, fy = l.y * uShipS;
      float st = vnoise(vec2(fx * 1.1, fy * 4.5)) * vnoise(vec2(fx * 2.7 + 3.1, fy * 9.));

      foam += smoothstep(-0.2, 0., sd) * (0.6 + 0.4*n);

      gl_FragColor = vec4(col, 1.);
    }`

    d.outer.position.set(x, WY - 0.32 + Math.sin(Math.PI * s) * 0.92, z);
    d.pitch.rotation.z = Math.atan2(Math.cos(Math.PI * s) * 0.92 * Math.PI, 1.8);
    if (!d.s1 && s > 0.17) { d.s1 = true; splash(x, z, 9, 0.7); addRipple(x, z, t); }
    if (!d.s2 && s > 0.84) { d.s2 = true; splash(x, z, 12, 0.85); addRipple(x, z, t); }
  });

  drawSky(t);
  renderer.render(scene, camera);
}
function placeBubble(el, wp) {
  tmp2.copy(wp).project(camera);
  el.style.left = ((tmp2.x + 1) / 2 * W).toFixed(1) + 'px';
  el.style.top = ((1 - tmp2.y) / 2 * H).toFixed(1) + 'px';
}
frame();
})();
</script>
